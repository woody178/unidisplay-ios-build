name: Build iOS Unsigned IPA (LiveContainer / SideStore) & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA for LiveContainer
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        working-directory: viewer_app
        run: flutter pub get

      - name: Build iOS Release (No Codesign for LiveContainer / SideStore)
        working-directory: viewer_app
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned .app into .ipa
        working-directory: viewer_app/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 UniDisplay_iOS_LiveContainer.ipa Payload

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniDisplay-iOS-LiveContainer-IPA
          path: viewer_app/build/ios/iphoneos/UniDisplay_iOS_LiveContainer.ipa
          retention-days: 90
